<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerifyCOD — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="dashboard">
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/">verify<i>cod.</i></a>
    <div class="nav-sec">Main</div>
    <div class="nav-item" data-route="#/">📊 Dashboard</div>
    <div class="nav-item" data-route="#/orders">📦 Orders</div>
    <div class="nav-item" data-route="#/conversations">💬 Conversations</div>
    <div class="nav-item" data-route="#/review">🔍 Review queue <span class="cnt" id="reviewCount" style="display:none">0</span></div>
    <div class="nav-sec">Insights</div>
    <div class="nav-item" data-route="#/analytics">📈 Analytics</div>
    <div class="nav-sec">Developers</div>
    <div class="nav-item" data-route="#/integrations">🔌 Integrations</div>
    <div class="nav-item" data-route="#/developers/keys">🔑 API Keys</div>
    <div class="nav-item" data-route="#/developers/webhooks">🪝 Webhooks</div>
    <div class="nav-item" data-route="https://github.com/Shahjan00/VerifyCOD" data-external="1">📄 API Docs <span class="ext">↗</span></div>
    <div class="nav-sec">Account</div>
    <div class="nav-item" data-route="#/billing">💳 Billing</div>
    <div class="nav-item" data-route="#/settings">⚙️ Settings</div>
    <div class="nav-item" data-route="#/team">👥 Team</div>
    <div class="nav-item" data-route="#/logout">🚪 Sign out</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="ghost hamburger" id="hamburger" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="test">Test</button>
        <button data-mode="live" class="on">Live</button>
      </div>
      <span class="credits">Credits: <b id="creditsLeft">—</b></span>
      <button class="bell" id="bellBtn" aria-label="Notifications">🔔<span class="dot" id="bellDot" style="display:none"></span></button>
      <div class="avatar" id="avatarBtn" title="Account">S</div>
    </div>
    <div class="content" id="app"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div class="search-overlay" id="searchOverlay">
  <input id="searchInput" placeholder="Search order id, phone, customer…  (Esc to close)" autocomplete="off">
  <div id="searchResults" style="margin-top:8px"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/script/script.js"></script>
</body>
</html>
