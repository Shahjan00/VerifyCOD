<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerifyCOD — Dashboard</title>
<style>
  :root {
    --bg: #0a0a0b; --panel: #141416; --panel2: #1d1d20; --line: #26262a;
    --text: #f2f2f2; --muted: #9a9aa0; --faint: #66666c;
    --lime: #c8f542; --lime-dim: #1d2b12; --amber: #f5b942; --red: #f56a42; --green: #2fbf4a; --blue: #6aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
  a { color: var(--lime); text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--lime); color: #111; font-weight: 600; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--red); color: #fff; }
  button.sm { padding: 5px 10px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { background: #222; border: 1px solid #444; color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--lime); border-color: var(--lime); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { font-size: 18px; font-weight: 800; padding: 4px 10px 14px; display: flex; align-items: center; gap: 8px; }
  .logo .dot { color: var(--lime); }
  .nav-sec { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .8px; padding: 14px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 14px; }
  .nav-item:hover { background: var(--panel2); color: var(--text); }
  .nav-item.active { background: var(--lime-dim); color: var(--lime); font-weight: 600; }
  .nav-item .ico { width: 18px; text-align: center; }
  .nav-item .cnt { margin-left: auto; background: var(--amber); color: #111; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .nav-item .ext { margin-left: auto; font-size: 11px; color: var(--faint); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 20; }
  .topbar .spacer { flex: 1; }
  .hamburger { display: none; background: var(--panel2); color: var(--text); padding: 8px 10px; }
  .mode-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .mode-toggle button { border-radius: 0; padding: 6px 12px; background: transparent; color: var(--muted); font-size: 12px; }
  .mode-toggle button.on { background: var(--lime); color: #111; }
  .credits { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .credits b { color: var(--lime); }
  .bell { position: relative; background: var(--panel2); color: var(--text); padding: 8px 10px; }
  .bell .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--lime); color: #111; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .content { padding: 20px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .page-sub { color: var(--muted); font-size: 13px; margin: 4px 0 18px; }

  .grid { display: grid; gap: 14px; }
  .grid.kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .grid.two { grid-template-columns: 1.6fr 1fr; }
  .grid.three { grid-template-columns: repeat(3, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .kpi .num { font-size: 26px; font-weight: 800; margin: 4px 0 2px; }
  .kpi .lbl { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
  .badge.ok { background: var(--lime); color: #111; }
  .badge.warn { background: var(--amber); color: #111; }
  .badge.bad { background: var(--red); color: #fff; }
  .badge.idle { background: #333; color: #ccc; }
  .badge.info { background: #22344d; color: var(--blue); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:hover td { background: var(--panel2); }
  tr.clickable { cursor: pointer; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .alert { border: 1px solid var(--amber); background: #2a2113; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 10px; }
  .alert.red { border-color: var(--red); background: #2a1512; }
  .feed-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed-item:last-child { border-bottom: 0; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .empty button { margin-top: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--muted); border-radius: 8px 8px 0 0; padding: 8px 14px; }
  .tabs button.on { color: var(--lime); border-bottom: 2px solid var(--lime); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 11px; margin: 2px 2px 2px 0; }
  pre { background: #0a0a0a; border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
  .turn { padding: 8px 10px; border-radius: 8px; margin-top: 8px; line-height: 1.5; font-size: 13px; }
  .turn.agent { background: var(--lime-dim); border-left: 3px solid var(--lime); }
  .turn.customer { background: var(--panel2); border-left: 3px solid #888; }
  .turn .who { font-size: 10px; text-transform: uppercase; color: var(--muted); }
  .turn.playing { outline: 1px solid var(--lime); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .bar-row .lbl { width: 130px; color: var(--muted); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--lime); border-radius: 5px; }
  .bar-row .val { width: 44px; text-align: right; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: none; }
  .overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 92vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 50; padding: 20px; overflow-y: auto; transform: translateX(100%); transition: transform .2s; }
  .drawer.open { transform: translateX(0); }
  .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; z-index: 60; padding: 20px; display: none; max-height: 86vh; overflow-y: auto; }
  .modal.open { display: block; }
  .search-overlay { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; z-index: 60; padding: 14px; display: none; }
  .search-overlay.open { display: block; }
  .search-overlay input { width: 100%; font-size: 16px; padding: 12px; }
  .search-hit { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .search-hit:hover { background: var(--panel2); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--lime); color: #111; font-weight: 600; padding: 10px 18px; border-radius: 999px; z-index: 80; display: none; }
  .toast.show { display: block; }

  @media (max-width: 860px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 45; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .hamburger { display: block; }
    .grid.two, .grid.three { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="dot">◉</span> VerifyCOD</div>
    <div class="nav-sec">Main</div>
    <div class="nav-item" data-route="#/"><span class="ico">📊</span> Dashboard</div>
    <div class="nav-item" data-route="#/orders"><span class="ico">📦</span> Orders</div>
    <div class="nav-item" data-route="#/conversations"><span class="ico">💬</span> Conversations</div>
    <div class="nav-item" data-route="#/review"><span class="ico">🔍</span> Review queue <span class="cnt" id="reviewCount" style="display:none">0</span></div>
    <div class="nav-sec">Insights</div>
    <div class="nav-item" data-route="#/analytics"><span class="ico">📈</span> Analytics</div>
    <div class="nav-sec">Developers</div>
    <div class="nav-item" data-route="#/integrations"><span class="ico">🔌</span> Integrations</div>
    <div class="nav-item" data-route="#/developers/keys"><span class="ico">🔑</span> API Keys</div>
    <div class="nav-item" data-route="#/developers/webhooks"><span class="ico">🪝</span> Webhooks</div>
    <div class="nav-item" data-route="https://github.com/Shahjan00/VerifyCOD" data-external="1"><span class="ico">📄</span> API Docs <span class="ext">↗</span></div>
    <div class="nav-sec">Account</div>
    <div class="nav-item" data-route="#/billing"><span class="ico">💳</span> Billing</div>
    <div class="nav-item" data-route="#/settings"><span class="ico">⚙️</span> Settings</div>
    <div class="nav-item" data-route="#/team"><span class="ico">👥</span> Team</div>
    <div class="nav-item" data-route="#/logout"><span class="ico">🚪</span> Sign out</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer" style="flex:1"></div>
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="test">Test</button>
        <button data-mode="live" class="on">Live</button>
      </div>
      <span class="credits">Credits: <b id="creditsLeft">—</b></span>
      <button class="bell" id="bellBtn">🔔<span class="dot" id="bellDot" style="display:none"></span></button>
      <div class="avatar" id="avatarBtn" title="StyleKart — Owner">S</div>
    </div>
    <div class="content" id="app"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div class="search-overlay" id="searchOverlay">
  <input id="searchInput" placeholder="Search order id, phone, customer…  (Esc to close)" autocomplete="off">
  <div id="searchResults" style="margin-top:8px"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = ''; // same origin — landing page, dashboard and API all run on port 8000
const TOKEN = localStorage.getItem('vc_token');
if (!TOKEN) { location.href = '/'; } // not signed in -> landing page
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtINR = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const fmtDate = t => t ? new Date(t * 1000).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const maskPhone = p => { const d = String(p || '').replace(/\D/g, ''); return d.length > 4 ? '+' + d.slice(0, 2) + ' ' + d.slice(2, 7) + '****' + d.slice(-1) : p; };

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN, ...(opts.headers || {}) },
    ...opts,
  });
  if (res.status === 401) { // session expired or signed out elsewhere
    localStorage.removeItem('vc_token'); localStorage.removeItem('vc_merchant');
    location.href = '/';
    throw new Error('Signed out');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function copyText(txt, msg) {
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => toast(msg || 'Copied'))
    .catch(() => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg || 'Copied'); });
}

function openDrawer(html) { $('drawer').innerHTML = html; $('drawer').classList.add('open'); $('overlay').classList.add('open'); }
function closeDrawer() { $('drawer').classList.remove('open'); if (!$('modal').classList.contains('open')) $('overlay').classList.remove('open'); $('sidebar').classList.remove('open'); }
function openModal(html) { $('modal').innerHTML = html; $('modal').classList.add('open'); $('overlay').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); if (!$('drawer').classList.contains('open')) $('overlay').classList.remove('open'); }
$('overlay').onclick = () => { closeDrawer(); closeModal(); closeSearch(); };
$('hamburger').onclick = () => $('sidebar').classList.toggle('open');

let mode = localStorage.getItem('vc_mode') || 'live';
function renderMode() {
  document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}
document.querySelectorAll('#modeToggle button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; localStorage.setItem('vc_mode', mode); renderMode();
  toast(mode === 'test' ? 'Test mode — sandbox data only' : 'Live mode');
  route();
});
renderMode();

function openSearch() { $('searchOverlay').classList.add('open'); $('searchInput').value = ''; $('searchResults').innerHTML = ''; $('searchInput').focus(); }
function closeSearch() { $('searchOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape') { closeSearch(); closeDrawer(); closeModal(); }
});
let searchCache = null;
$('searchInput').addEventListener('input', async e => {
  const q = e.target.value.trim().toLowerCase();
  if (q.length < 2) { $('searchResults').innerHTML = ''; return; }
  try {
    if (!searchCache) searchCache = await api('/v1/verifications?limit=100');
    const hits = searchCache.filter(v => {
      const o = v.order || {};
      return (v.verification_id || '').toLowerCase().includes(q)
        || (o.external_order_id || '').toLowerCase().includes(q)
        || ((o.customer || {}).name || '').toLowerCase().includes(q)
        || ((o.customer || {}).phone || '').includes(q);
    }).slice(0, 8);
    $('searchResults').innerHTML = hits.length ? hits.map(v => {
      const o = v.order || {};
      return `<div class="search-hit" onclick="closeSearch(); location.hash='#/orders'; openOrderDrawer('${v.verification_id}')">
        <b>${esc((o.customer || {}).name || '—')}</b> · ${esc(o.external_order_id || v.verification_id)}
        <span class="muted"> — ${esc(v.outcome || v.status)}</span></div>`;
    }).join('') : '<p class="muted small" style="padding:8px">No matches.</p>';
  } catch (err) { $('searchResults').innerHTML = '<p class="muted small" style="padding:8px">Search unavailable — is the API running?</p>'; }
});

function lineChart(days) {
  const W = 560, H = 180, P = 28;
  const maxV = Math.max(1, ...days.flatMap(d => [d.total || 0, d.confirmed || 0]));
  const x = i => P + (i * (W - 2 * P)) / Math.max(1, days.length - 1);
  const y = v => H - P - (v / maxV) * (H - 2 * P);
  const line = key => days.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(d[key] || 0).toFixed(1)).join(' ');
  const pts = (key, color) => days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d[key] || 0)}" r="3" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#26262a"/>
    <line x1="${P}" y1="${P}" x2="${P}" y2="${H - P}" stroke="#26262a"/>
    <path d="${line('total')}" fill="none" stroke="#888" stroke-width="2"/>${pts('total', '#888')}
    <path d="${line('confirmed')}" fill="none" stroke="#c8f542" stroke-width="2"/>${pts('confirmed', '#c8f542')}
    <text x="${P}" y="14" fill="#9a9aa0" font-size="11">Total (grey) vs Confirmed (lime) — last ${days.length} days</text>
    ${days.map((d, i) => `<text x="${x(i)}" y="${H - 8}" fill="#66666c" font-size="10" text-anchor="middle">${esc(d.date.slice(5))}</text>`).join('')}
  </svg>`;
}
function donutChart(split) {
  const total = Object.values(split).reduce((a, b) => a + b, 0) || 1;
  const colors = { CONFIRMED: '#c8f542', ADDRESS_UPDATED: '#6aa9ff', CANCELLED_BY_CUSTOMER: '#f56a42', RESCHEDULED: '#f5b942', WRONG_PERSON: '#888', CALLBACK_REQUESTED: '#b48cf2', NEEDS_REVIEW: '#f5b942' };
  let off = 25, segs = '';
  for (const [k, v] of Object.entries(split)) {
    const frac = v / total;
    segs += `<circle r="15.915" cx="21" cy="21" fill="transparent" stroke="${colors[k] || '#888'}" stroke-width="6" stroke-dasharray="${(frac * 100).toFixed(1)} ${100 - frac * 100}" stroke-dashoffset="${off}"/>`;
    off -= frac * 100;
  }
  return `<div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap">
    <svg viewBox="0 0 42 42" style="width:120px; height:120px">${segs}
      <text x="21" y="22" fill="#f2f2f2" font-size="8" text-anchor="middle" font-weight="700">${total}</text>
      <text x="21" y="29" fill="#9a9aa0" font-size="4.5" text-anchor="middle">calls</text></svg>
    <div>${Object.entries(split).map(([k, v]) => `<div class="small" style="margin:4px 0"><span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:${colors[k] || '#888'}; margin-right:6px"></span>${esc(k)} — <b>${v}</b> (${Math.round(v / total * 100)}%)</div>`).join('')}</div>
  </div>`;
}
function barList(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  return items.map(i => `<div class="bar-row"><span class="lbl">${esc(i.label)}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(i.value / max * 100)}%"></div></div>
    <span class="val">${i.value}</span></div>`).join('');
}
function outcomeBadge(v) {
  const o = v.outcome || v.status;
  const cls = (o === 'CONFIRMED' || o === 'ADDRESS_UPDATED') ? 'ok' : o === 'NEEDS_REVIEW' ? 'warn' : (o === 'CANCELLED_BY_CUSTOMER' || o === 'cancelled') ? 'bad' : 'idle';
  return `<span class="badge ${cls}">${esc(o)}</span>`;
}
function statusBadge(s) {
  const cls = s === 'completed' ? 'ok' : s === 'needs_review' ? 'warn' : s === 'cancelled' ? 'bad' : s === 'calling' ? 'info' : 'idle';
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
// --- router ---
const ROUTES = {
  '/': { title: 'Dashboard', render: pageDashboard },
  '/orders': { title: 'Orders', render: pageOrders },
  '/conversations': { title: 'Conversations', render: pageConversations },
  '/review': { title: 'Review queue', render: pageReview },
  '/analytics': { title: 'Analytics', render: pageAnalytics },
  '/integrations': { title: 'Integrations', render: pageIntegrations },
  '/developers/keys': { title: 'API Keys', render: pageApiKeys },
  '/developers/webhooks': { title: 'Webhooks', render: pageWebhooks },
  '/billing': { title: 'Billing', render: pageBilling },
  '/settings': { title: 'Settings', render: pageSettings },
  '/team': { title: 'Team', render: pageTeam },
  '/logout': { title: 'Signed out', render: pageLogout },
};
let pollers = [];
function stopPollers() { pollers.forEach(clearInterval); pollers = []; }
async function route() {
  stopPollers(); closeDrawer();
  const hash = location.hash.replace(/^#/, '') || '/';
  const [path, param] = hash.split('/').filter(Boolean).length ? (() => {
    const parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'conversations' && parts[1]) return ['/conversations/:id', parts[1]];
    return ['/' + parts.join('/'), null];
  })() : ['/', null];
  const r = ROUTES[path] || ROUTES['/'];
  $('pageTitle').textContent = r.title;
  document.querySelectorAll('.nav-item[data-route]').forEach(n => {
    const rt = n.dataset.route;
    n.classList.toggle('active', !n.dataset.external && (rt === '#' + path || (path === '/' && rt === '#/')));
  });
  $('app').innerHTML = '<p class="muted">Loading…</p>';
  try { await r.render($('app'), param); }

let callAudioEl = null, waveData = null;
async function drawWaveform(callId) {
  try {
    const res = await fetch(API + '/v1/calls/' + callId + '/recording');
    if (!res.ok) { $('playTime').textContent = 'No recording yet.'; return; }
    const buf = await res.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuf = await ctx.decodeAudioData(buf);
    const data = audioBuf.getChannelData(0);
    waveData = { buf: audioBuf, duration: audioBuf.duration };
    const canvas = $('waveCanvas'), c2 = canvas.getContext('2d');
    c2.clearRect(0, 0, canvas.width, canvas.height);
    c2.fillStyle = '#c8f542';
    const step = Math.floor(data.length / canvas.width);
    for (let x = 0; x < canvas.width; x++) {
      let peak = 0;
      for (let i = 0; i < step; i += 4) { const v = Math.abs(data[x * step + i] || 0); if (v > peak) peak = v; }
      const h = Math.max(1, peak * canvas.height);
      c2.fillRect(x, (canvas.height - h) / 2, 1, h);
    }
    $('playTime').textContent = 'Duration ' + audioBuf.duration.toFixed(1) + 's — press play.';
    callAudioEl = $('callAudio');
    callAudioEl.src = API + '/v1/calls/' + callId + '/recording';
  } catch (e) { const pt = $('playTime'); if (pt) pt.textContent = 'Recording unavailable.'; }
}
function toggleCallAudio() {
  if (!callAudioEl) return;
  if (callAudioEl.paused) { callAudioEl.play(); $('playBtn').textContent = '⏸ Pause'; }
  else { callAudioEl.pause(); $('playBtn').textContent = '▶ Play recording'; }
  callAudioEl.onended = () => { $('playBtn').textContent = '▶ Play recording'; };
  callAudioEl.ontimeupdate = () => { $('playTime').textContent = callAudioEl.currentTime.toFixed(1) + 's / ' + (callAudioEl.duration || 0).toFixed(1) + 's'; };
}
function playTurn(i, url) {
  const a = new Audio(API + url);
  document.querySelectorAll('.turn.playing').forEach(t => t.classList.remove('playing'));
  const el = $('turn-' + i); if (el) el.classList.add('playing');
  a.play();
  a.onended = () => { if (el) el.classList.remove('playing'); };
}
function downloadRecording(callId) {
  const a = document.createElement('a');
  a.href = API + '/v1/calls/' + callId + '/recording';
  a.download = 'call_' + callId + '.wav'; a.click();

async function saveSettings() {
  const s = settingsCache || {};
  const patch = {};
  const val = id => { const el = $(id); return el ? el.value : undefined; };
  ['brand_name', 'support_number', 'calling_hours_start', 'calling_hours_end', 'default_language', 'voice', 'delivery_time'].forEach(k => { const v = val('set_' + k); if (v !== undefined) patch[k] = v; });
  ['max_attempts', 'retry_gap_minutes', 'risk_value_threshold', 'retention_days'].forEach(k => { const v = val('set_' + k); if (v !== undefined && v !== '') patch[k] = parseInt(v, 10); });
  ['greeting', 'return_policy'].forEach(k => { const v = val('set_' + k); if (v !== undefined) patch[k] = v; });
  ['allowed_languages', 'risk_pincodes', 'do_not_call'].forEach(k => { const v = val('set_' + k); if (v !== undefined) patch[k] = v.split(',').map(x => x.trim()).filter(Boolean); });
  const c1 = $('set_risk_first_time_only'); if (c1) patch.risk_first_time_only = c1.checked;
  const c2 = $('set_recording_enabled'); if (c2) patch.recording_enabled = c2.checked;
  settingsCache = await api('/v1/settings', { method: 'PUT', body: JSON.stringify(patch) });
  toast('Settings saved');
}

    <div class="card"><h2>Members</h2>
      ${members.length ? `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Invited</th></tr></thead>
      <tbody>${members.map(m => `<tr><td>${esc(m.email)}</td><td>${esc(m.role)}</td><td>${esc(m.status)}</td><td>${fmtDate(m.invited_at)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">Just you (Owner) so far. Invite your team above.</div>'}
      <p class="muted small" style="margin-top:12px"><b>Owner:</b> everything, billing, delete account. <b>Admin:</b> everything except deleting the account. <b>Ops:</b> orders, conversations, review queue. <b>Developer:</b> keys, webhooks, integrations, logs. <b>Viewer:</b> read-only, masked data.</p>
    </div>`;
}
async function inviteMember() {
  const email = $('inviteEmail').value.trim();
  const role = $('inviteRole').value;
  if (!email) { toast('Enter an email'); return; }
  await api('/v1/team/invite', { method: 'POST', body: JSON.stringify({ email, role }) });
  toast('Invite sent to ' + email); route();
}

// --- 12. Sign out ---
function pageLogout(app) {
  // clear the session (server-side too, best effort) and go back to the landing page
  fetch(API + '/v1/auth/signout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN } }).catch(() => {});
  localStorage.removeItem('vc_token'); localStorage.removeItem('vc_merchant');
  app.innerHTML = `<div class="card" style="text-align:center; padding:48px 20px">
    <h2>You signed out</h2>
    <p class="muted">Your session is cleared. Your data is still here when you sign back in.</p>
    <button onclick="location.href='/'">Back to VerifyCOD</button>
  </div>`;
}

// --- init ---
route();
</script>
</body>
</html>
